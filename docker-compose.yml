version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: voting-app-redis
    command: redis-server --requirepass "${REDIS_PWD:-secretpassword}"
    ports:
      - "6379:6379"

  voting-app:
    build:
      context: ./azure-vote
      dockerfile: Dockerfile
    container_name: voting-app-web
    depends_on:
      - redis
    ports:
      - "8080:80"
    environment:
      - REDIS=redis
      - REDIS_PWD=${REDIS_PWD:-secretpassword}
